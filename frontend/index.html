<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Lost & Found System | Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #0d6efd, #6ea8fe);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      margin: auto;
      text-align: center;
    }

    .hero-icon {
      font-size: 60px;
      color: #0d6efd;
    }

    .btn-lg {
      min-width: 150px;
    }

    footer {
      margin-top: auto;
      padding: 15px;
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-dark bg-primary shadow">
    <div class="container">
      <h4 class="text-white m-auto">
        <i class="fa-solid fa-location-dot"></i> College Lost & Found System
      </h4>
    </div>
  </nav>

  <div class="container d-flex align-items-center justify-content-center flex-grow-1">

    <div class="hero-box">

      <i class="fa-solid fa-magnifying-glass-location hero-icon"></i>

      <h2 class="mt-4">Welcome to Lost & Found Portal</h2>
      <p class="text-muted">
        Helping students report and recover lost items quickly and securely.
      </p>

      <div class="mt-4">
        <a href="login.html" class="btn btn-primary btn-lg m-2">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </a>

        <a href="register.html" class="btn btn-outline-primary btn-lg m-2">
          <i class="fa-solid fa-user-plus"></i> Register
        </a>
      </div>

    </div>

  </div>

  <footer>
    © 2026 College Lost & Found System | Developed for Campus Use
  </footer>

</body>

</html>
