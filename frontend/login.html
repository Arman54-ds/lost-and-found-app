<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Lost & Found System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #0d6efd, #6ea8fe);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 400px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      padding: 35px;
      background: #ffffff;
    }

    .login-icon {
      font-size: 55px;
      color: #0d6efd;
    }

    .form-control {
      border-radius: 8px;
    }

    .btn-primary {
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="text-center mb-4">
    <i class="fa-solid fa-user-circle login-icon mb-3"></i>
    <h4 class="fw-bold">Welcome Back</h4>
    <p class="text-muted small">Login to access your account</p>
  </div>

  <!-- LOGIN FORM -->
  <form id="loginForm">

    <div class="mb-3">
      <input 
        type="email" 
        id="email" 
        class="form-control" 
        placeholder="Enter Email"
        required
      >
    </div>

    <div class="input-group mb-3">
      <input 
        type="password" 
        id="password" 
        class="form-control" 
        placeholder="Enter Password"
        required
      >
      <button 
        class="btn btn-outline-secondary" 
        type="button" 
        onclick="togglePassword()"
      >
        <i class="fa fa-eye"></i>
      </button>
    </div>

    <button id="loginBtn" type="submit" class="btn btn-primary w-100 mb-3">
      Login
    </button>

  </form>

  <p class="text-center text-muted small">
    Don’t have an account?
    <a href="register.html">Register</a>
  </p>

  <p id="msg" class="text-danger text-center small mt-2"></p>

</div>

<script>

const BASE_URL = window.BASE_URL || "";

// Auto redirect if already logged in
const existingUser = JSON.parse(localStorage.getItem("user"));
if (existingUser && existingUser.id) {
  if (existingUser.role === "admin") {
    window.location.href = "admin.html";
  } else {
    window.location.href = "dashboard.html";
  }
}

// ================= LOGIN FUNCTION =================
document.getElementById("loginForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const loginBtn = document.getElementById("loginBtn");
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!email || !password) {
    msg.innerText = "Please enter email and password";
    return;
  }

  loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Logging in...`;
  loginBtn.disabled = true;

  try {

    const res = await fetch(`${BASE_URL}/api/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {

      localStorage.setItem("user", JSON.stringify(data.user));

      if (data.user.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "dashboard.html";
      }

    } else {
      msg.innerText = data.message || "Invalid email or password";
    }

  } catch (error) {
    msg.innerText = "Server error. Please try again.";
  }

  loginBtn.innerHTML = "Login";
  loginBtn.disabled = false;

});

// ================= TOGGLE PASSWORD =================
function togglePassword() {
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
}

</script>

</body>
</html>
